name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── JOB 1: Run tests and generate coverage report ───────────────────────────
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest

    # Spin up a real PostgreSQL container for the test run
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: jobtracker_test
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Check out the repo code
      - uses: actions/checkout@v4

      # Set up Node.js with npm cache for faster installs
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # Install backend dependencies using lockfile (faster, deterministic)
      - name: Install backend dependencies
        run: cd backend && npm ci

      # Run Jest with coverage — fails if tests fail
      - name: Run tests with coverage
        run: cd backend && npm run test:cov
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: admin
          DB_PASS: password
          DB_NAME: jobtracker_test
          JWT_SECRET: test-secret  # Non-sensitive, only used in ephemeral test DB
          NODE_ENV: test

      # Upload the HTML coverage report as a downloadable artifact
      # Available for 7 days after each run under Actions > Artifacts
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/lcov-report/
          retention-days: 7

  # ─── JOB 2: Build and push backend Docker image ───────────────────────────────
  build-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: test  # Only runs if tests pass

    steps:
      - uses: actions/checkout@v4

      # Log in to GitHub Container Registry using the auto-generated GITHUB_TOKEN
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the Docker image — only push to registry when merging to main
      # On develop branch: builds only (validates Dockerfile), does not push
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/backend:latest

  # ─── JOB 3: Build and push frontend Docker image ──────────────────────────────
  build-frontend:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    needs: test  # Only runs if tests pass

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the Docker image — only push to registry when merging to main
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/frontend:latest