name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Ensures all actions run with Node.js 24 for consistency
  REPO_OWNER: iskandar-mhadhbi
  
jobs:
  # ─── JOB 1: Run tests and generate coverage report ───────────────────────────
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest

    # Spin up a real PostgreSQL container for the test run
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: jobtracker_test
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Check out the repo code
      - uses: actions/checkout@v4

      # Set up Node.js with npm cache for faster installs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # Install backend dependencies using lockfile (faster, deterministic)
      - name: Install backend dependencies
        run: cd backend && npm ci
        # Lint the backend code — fails if linting errors are found
      - name: Run backend lint
        run: cd backend && npm run lint
      # Run Jest with coverage — fails if tests fail
      - name: Run tests with coverage
        run: cd backend && npm run test:cov
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: admin
          DB_PASS: password
          DB_NAME: jobtracker_test
          JWT_SECRET: test-secret  # Non-sensitive, only used in ephemeral test DB
          NODE_ENV: test
          GEMINI_API_KEY: test-gemini-key
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_S3_BUCKET: job-tracker-cvs

      # Upload the HTML coverage report as a downloadable artifact
      # Available for 7 days after each run under Actions > Artifacts
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/lcov-report/
          retention-days: 7

  # ─── JOB 2: Build and push backend Docker image ───────────────────────────────
  build-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: test  # Only runs if tests pass
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4 
      - uses: actions/setup-node@v4
        with:
          node-version: 24 
      # Log in to GitHub Container Registry using the auto-generated GITHUB_TOKEN
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the Docker image — only push to registry when merging to main
      # On develop branch: builds only (validates Dockerfile), does not push
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/iskandar-mhadhbi/job-tracker/backend:latest

  # ─── JOB 3: Build and push frontend Docker image ──────────────────────────────
  build-frontend:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    needs: test  # Only runs if tests pass
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Install frontend dependencies using lockfile (faster, deterministic)    
      - name: Install frontend dependencies
        run: cd frontend && npm ci
        # Lint the frontend code — fails if linting errors are found
      - name: Run frontend lint
        run: cd frontend && npm run lint
      # Build the Docker image — only push to registry when merging to main
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/iskandar-mhadhbi/job-tracker/frontend:latest
  # ─── JOB 4: Smoke Test with k6 ───────────────────────────────────────────────
  smoke-test:
    name: Smoke Test (k6)
    runs-on: ubuntu-latest
    needs: [test, build-backend, build-frontend]  # runs after all three
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: jobtracker_test
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Build backend
        run: cd backend && npm run build

      - name: Start backend
        run: cd backend && node dist/main &
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: admin
          DB_PASS: password
          DB_NAME: jobtracker_test
          JWT_SECRET: test-secret
          NODE_ENV: test
          GEMINI_API_KEY: test-gemini-key
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_S3_BUCKET: job-tracker-cvs
          PORT: 3000
          FRONTEND_URL: http://localhost:4200

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            curl -s http://localhost:3000/api && break
            sleep 2
          done

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run smoke test
        run: k6 run k6/smoke-test.js
        env:
          BASE_URL: http://localhost:3000/api

  # ─── JOB 5: Stress Test (main branch only) ───────────────────────────────────
  stress-test:
    name: Stress Test (k6)
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.ref == 'refs/heads/main'  # Only runs on main branch

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: jobtracker_test
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Build backend
        run: cd backend && npm run build

      - name: Start backend
        run: cd backend && node dist/main &
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: admin
          DB_PASS: password
          DB_NAME: jobtracker_test
          JWT_SECRET: test-secret
          NODE_ENV: test
          GEMINI_API_KEY: test-gemini-key
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_S3_BUCKET: job-tracker-cvs
          PORT: 3000
          FRONTEND_URL: http://localhost:4200

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            curl -s http://localhost:3000/api && break
            sleep 2
          done

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run stress test
        run: k6 run k6/stress-test.js
        env:
          BASE_URL: http://localhost:3000/api        