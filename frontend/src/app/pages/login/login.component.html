<div class="login-container">
  <div class="login-card">
    <h1>Job Tracker</h1>
    <h2>{{ isRegister ? 'Create Account' : 'Sign In' }}</h2>

    <form (ngSubmit)="submit()">
      <div class="form-group" *ngIf="isRegister">
        <label>Name</label>
        <input type="text" [(ngModel)]="name" name="name" placeholder="Your name" />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="Min 8 characters" required />
      </div>

      <p class="error" *ngIf="error">{{ error }}</p>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Please wait...' : (isRegister ? 'Register' : 'Login') }}
      </button>
    </form>

    <p class="toggle">
      {{ isRegister ? 'Already have an account?' : "Don't have an account?" }}
      <a (click)="toggle()">{{ isRegister ? 'Sign in' : 'Register' }}</a>
    </p>
  </div>
</div>
