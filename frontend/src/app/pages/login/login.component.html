<div class="login-container">
  <div class="login-card">
    <h1>Job Tracker</h1>
    <h2>{{ isRegister ? 'Create Account' : 'Sign In' }}</h2>

    <form (ngSubmit)="submit()">
      @if (isRegister) {
        <div class="form-group">
          <label for="name">Name</label>
          <input id="name" type="text" [(ngModel)]="name" name="name" placeholder="Your name" />
        </div>
      }

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="Min 8 characters" required />
      </div>

      @if (error) {
        <p class="error">{{ error }}</p>
      }

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Please wait...' : (isRegister ? 'Register' : 'Login') }}
      </button>
    </form>

    <p class="toggle">
      {{ isRegister ? 'Already have an account?' : "Don't have an account?" }}
      <a (click)="toggle()" (keypress)="toggle()" tabindex="0" role="button">{{ isRegister ? 'Sign in' : 'Register' }}</a>
    </p>
  </div>
</div>
